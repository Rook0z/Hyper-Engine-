[tool.poetry]
name = "hyper-engine"
version = "0.1.0"
description = "Hyperliquid algorithmic trading engine"
authors = ["Rook0z"]
license = "MIT"
packages = [{ include = "hyperliquid", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12"
eth-account = {version = "^0.13.7", python = ">=3.12,<4"}
msgpack = {version = "^1.1.2", python = ">=3.12,<4"}
httpx = {version = "^0.28.1", python = ">=3.12,<4"}
python-dotenv = {version = "^1.2.2", python = ">=3.12,<4"}
pydantic = "^2.13.4"
pandas = "^3.0.3"
numpy = "^2.5.0"
pydantic-settings = "^2.14.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
ruff = "^0.4"
mypy = "^2.1.0"
pandas-stubs = "^3.0.0"
msgpack-types = {version = "^0.7.0", python = ">=3.12,<4"}

[tool.poetry.group.dashboard]
optional = true

[tool.poetry.group.dashboard.dependencies]
streamlit = "^1.38"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = [
    # TestnetSafetyError / TestnetExecutionError / TestnetExecutor all
    # start with "Test", pytest's default collection pattern — when
    # tests/test_testnet_executor.py imports them, pytest tries (and
    # correctly declines, since they have __init__ constructors) to
    # collect them as test classes. Cosmetic only; nothing is actually
    # skipped that should have run. Renaming production exception/
    # class names to dodge a test-runner's naming convention would be
    # the wrong fix, so the warning is silenced here instead.
    "ignore::pytest.PytestCollectionWarning",
]

[tool.ruff.lint.per-file-ignores]
# app.py must insert src/ onto sys.path BEFORE importing core.database
# and dashboard.views (Streamlit only auto-adds the script's own
# directory to sys.path, not src/ — see app.py's own docstring for
# the full explanation). That ordering is required, not accidental,
# so E402 ("module level import not at top of file") is a false
# positive here specifically, not a general license to reorder
# imports elsewhere in the project.
"src/dashboard/app.py" = ["E402"]

[tool.mypy]
# The project has a stray src/__init__.py (making "src" itself a
# regular package), while every internal import in the codebase uses
# bare names ("core.config", "strategies.ema_strategy", ...) as if
# src's children were top-level packages — the same assumption
# tool.pytest.ini_options.pythonpath already encodes above.
#
# mypy_path registers "src" as an additional search root.
# explicit_package_bases tells mypy to use the closest ancestor
# directory listed in mypy_path ("src") as a file's package base,
# instead of continuing to walk up through src/__init__.py to the
# project root. Together these make mypy compute
# src/core/config.py -> "core.config" (matching the actual import
# statements) rather than "src.core.config". No source file needs to
# change for this.
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
# Streamlit lives in an OPTIONAL dependency group (poetry install
# --with dashboard), so the default CI environment (plain `poetry
# install`) never has it installed. This targets the missing PACKAGE
# itself (streamlit) rather than only the modules that import it —
# ignore_missing_imports on an importING module only suppresses
# errors about resolving *that* module from elsewhere, not missing-
# import errors for packages it imports internally. Targeting
# streamlit directly is what actually silences "Cannot find
# implementation or library stub for module named 'streamlit'"
# wherever it's imported (dashboard/app.py, dashboard/views/*.py).
module = ["streamlit", "streamlit.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Belt-and-suspenders: if some OTHER file imports dashboard.app or
# dashboard.views.* directly (rather than importing streamlit), this
# additionally suppresses any resulting "cannot find implementation"
# error for THAT import, on the same optional-dependency reasoning as
# above. dashboard/data.py is deliberately NOT listed here — it has
# no Streamlit import and is checked normally, like every other
# module in the project.
module = ["dashboard.app", "dashboard.views.*"]
ignore_missing_imports = true
[tool.poetry]
name = "hyper-engine"
version = "0.1.0"
description = "Hyperliquid algorithmic trading engine"
authors = ["Rook0z"]
license = "MIT"
packages = [{ include = "hyperliquid", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12"
eth-account = {version = "^0.13.7", python = ">=3.12,<4"}
msgpack = {version = "^1.1.2", python = ">=3.12,<4"}
httpx = {version = "^0.28.1", python = ">=3.12,<4"}
python-dotenv = {version = "^1.2.2", python = ">=3.12,<4"}
pydantic = "^2.13.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
ruff = "^0.4"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]